napcat:
  accounts:
    # 当前 NC_WS_URL 对应的主号。
    - id: "2799397589"
      name: 主号
      adminGroup: 646247690

    # 饭总使用的第二个 NapCat 实例；连接信息在 .env 的 NC_WS_URL_2 /
    # NC_ACCESS_TOKEN_2 中配置。
    - id: "2227511984"
      name: 饭总号
      wsUrlEnv: NC_WS_URL_2
      accessTokenEnv: NC_ACCESS_TOKEN_2
      adminGroup: 1101365727

up:
  - dynamic: false
    dynamicMonitorConfig: {}

    live: true
    liveMonitorConfig:
      enableNotify: true
      notifyGroups:
        - 1101365727
        - 511731882
        - 1045653883
        - 1092028491
        - 633120010
        - 721662821
      messageTemplate:
        start: "{uname}播了 http://live.bilibili.com/{roomId} {@all}"

    # 词云属于这个主播。下播后发到这里列出的群，不发到开播通知群，也不走全局配置。
    wordcloud:
      enabled: true
      notifyGroups:
        - 1101365727

    qqAccount: "2227511984"
    uid: 145149047
    liveRoomId: 4629447
    uname: 饭总

adminEmail:
  address: 1902791450@qq.com
  cc:
    - qiyuor2@gmail.com

# 词云的分词与渲染，所有主播共用。推送到哪些群写在对应主播的 wordcloud 上。
# 全部字段可选，不写时使用默认值。
wordcloud:
  # 词云展示词数与最短词长
  topN: 60
  minWordLength: 2
  # 额外停用词 / 噪音词（主播名会自动过滤）
  stopWords: []
  noiseWords: []
  # 下播兜底轮询间隔（毫秒），0 表示关闭
  pollIntervalMs: 300000
