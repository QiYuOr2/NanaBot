# 词云的分词与渲染，所有主播共用。推送到哪些群写在对应主播的 wordcloud 上。
# 全部字段可选，不写时使用默认值。
wordcloud:
  # 词云展示词数与最短词长
  topN: 60
  minWordLength: 2
  # 额外停用词 / 噪音词（主播名会自动过滤）
  stopWords: []
  noiseWords: []
  # 下播兜底轮询间隔（毫秒），0 表示关闭
  pollIntervalMs: 300000
