<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1280" viewBox="0 0 1720 1280" role="img" aria-labelledby="title desc">
  <title id="title">NanaBot 工程架构图</title>
  <desc id="desc">基于当前代码的 NanaBot 架构：外部服务、Bot/Site 应用、QQ 连接层与其他 workspace 包、共享配置与 SQLite 数据。</desc>
  <defs>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#263449}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#718096}
      .heading{font-size:32px;font-weight:750;fill:#17243a}
      .subheading{font-size:15px;fill:#718096}
      .layer{font-size:17px;font-weight:750;fill:#334155}
      .label{font-size:17px;font-weight:700}
      .desc{font-size:13px;fill:#64748b}
      .tiny{font-size:12px;fill:#718096}
      .module{font-size:14px;font-weight:700}
      .module-desc{font-size:12px;fill:#718096}
      .solid{fill:none;stroke:#718096;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
      .dashed{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 6}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker>
  </defs>
  <rect width="1720" height="1280" fill="#f7f9fc"/>

  <text x="80" y="52" class="eyebrow">NANABOT / V2 ENGINEERING OVERVIEW</text>
  <text x="80" y="98" class="heading">NanaBot 工程架构</text>
  <text x="80" y="126" class="subheading">TypeScript · pnpm workspace · Vite+ · Bot / Site 独立部署，共享配置与 SQLite 数据</text>
  <g transform="translate(1280 72)">
    <path d="M0 0H42" class="solid" marker-end="url(#arrow)"/><text x="54" y="4" class="tiny">运行调用 / 数据流</text>
    <path d="M0 26H42" class="dashed" marker-end="url(#arrow)"/><text x="54" y="30" class="tiny">workspace 依赖</text>
  </g>

  <!-- ========== 外部服务 ========== -->
  <rect x="64" y="156" width="1592" height="150" rx="6" fill="#fff" stroke="#dfe6ef"/>
  <text x="88" y="188" class="layer">外部服务</text>
  <g>
    <rect x="240" y="178" width="248" height="100" rx="4" fill="#f0f5ff" stroke="#cbdaf3"/>
    <text x="260" y="210" class="label" fill="#315f9c">Bilibili</text>
    <text x="260" y="236" class="desc">REST API · 直播信息</text>
    <text x="260" y="256" class="desc">blive 长连接 · 弹幕事件</text>

    <rect x="512" y="178" width="248" height="100" rx="4" fill="#f4f1ff" stroke="#d9d1f2"/>
    <text x="532" y="210" class="label" fill="#6655a5">QQ 官方平台</text>
    <text x="532" y="236" class="desc">Gateway / Bot API</text>
    <text x="532" y="256" class="desc">腾讯 Node.js SDK</text>

    <rect x="784" y="178" width="248" height="100" rx="4" fill="#f4f1ff" stroke="#d9d1f2"/>
    <text x="804" y="210" class="label" fill="#6655a5">NapCat</text>
    <text x="804" y="236" class="desc">WebSocket / OneBot</text>
    <text x="804" y="256" class="desc">node-napcat-ts</text>

    <rect x="1056" y="178" width="248" height="100" rx="4" fill="#fff7ed" stroke="#f0d7b9"/>
    <text x="1076" y="210" class="label" fill="#a96527">DeepSeek</text>
    <text x="1076" y="236" class="desc">直播整场弹幕摘要</text>
    <text x="1076" y="256" class="desc">模型 API</text>

    <rect x="1328" y="178" width="248" height="100" rx="4" fill="#eef8f3" stroke="#cce5d7"/>
    <text x="1348" y="210" class="label" fill="#347b59">通知服务</text>
    <text x="1348" y="236" class="desc">SMTP 邮件 · Bark</text>
    <text x="1348" y="256" class="desc">离线告警投递</text>
  </g>

  <path d="M364 328V360" class="solid" marker-end="url(#arrow)"/>
  <path d="M636 328V360" class="solid" marker-end="url(#arrow)"/>
  <path d="M908 328V360" class="solid" marker-end="url(#arrow)"/>
  <path d="M1180 328V360" class="solid" marker-end="url(#arrow)"/>
  <path d="M1452 328V360" class="solid" marker-end="url(#arrow)"/>

  <!-- ========== 应用层 ========== -->
  <rect x="64" y="360" width="1592" height="318" rx="6" fill="#fff" stroke="#dfe6ef"/>
  <text x="88" y="392" class="layer">应用层</text>
  <text x="88" y="414" class="tiny">独立部署 · PM2 可分别启停</text>

  <rect x="240" y="390" width="820" height="260" rx="5" fill="#eef4ff" stroke="#b9cdec" stroke-width="1.4"/>
  <path d="M244 390H1056V434H244Z" fill="#dce9fc"/>
  <text x="264" y="420" class="label" fill="#24528f">apps/bot</text>
  <text x="392" y="419" class="desc">QQ Bot · 多账号运行时与业务编排</text>

  <g>
    <rect x="264" y="454" width="184" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="280" y="480" class="module">core</text>
    <text x="280" y="504" class="module-desc">Feature 生命周期 · 连接监督</text>

    <rect x="462" y="454" width="184" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="478" y="480" class="module">accounts / qq</text>
    <text x="478" y="504" class="module-desc">多账号路由 · 通道选择</text>

    <rect x="660" y="454" width="184" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="676" y="480" class="module">message</text>
    <text x="676" y="504" class="module-desc">消息归一化 · 命令 / 规则</text>

    <rect x="858" y="454" width="178" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="874" y="480" class="module">control</text>
    <text x="874" y="504" class="module-desc">内部 HTTP 测试消息 API</text>

    <rect x="264" y="548" width="184" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="280" y="574" class="module">monitor</text>
    <text x="280" y="598" class="module-desc">直播状态 · 开播 / 下播通知</text>

    <rect x="462" y="548" width="184" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="478" y="574" class="module">danmu</text>
    <text x="478" y="598" class="module-desc">弹幕录制 · 会话 · 词云</text>

    <rect x="660" y="548" width="184" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="676" y="574" class="module">summary</text>
    <text x="676" y="598" class="module-desc">直播摘要生成 / 补推</text>

    <rect x="858" y="548" width="178" height="78" rx="3" fill="#fff" stroke="#d6e1f0"/>
    <text x="874" y="574" class="module">offline</text>
    <text x="874" y="598" class="module-desc">离线检测 · 邮件 / Bark</text>
  </g>

  <rect x="1110" y="390" width="470" height="260" rx="5" fill="#eff8f3" stroke="#b9dfca" stroke-width="1.4"/>
  <path d="M1114 390H1576V434H1114Z" fill="#dcefe4"/>
  <text x="1134" y="420" class="label" fill="#276849">apps/site</text>
  <text x="1252" y="419" class="desc">Nuxt 4 · Web Dashboard</text>

  <rect x="1134" y="454" width="422" height="78" rx="3" fill="#fff" stroke="#d4e8dc"/>
  <text x="1152" y="480" class="module">Web UI</text>
  <text x="1152" y="504" class="module-desc">概览 · 推送 · 弹幕 · 告警 · 日志 · 系统 · 设置</text>

  <rect x="1134" y="548" width="422" height="78" rx="3" fill="#fff" stroke="#d4e8dc"/>
  <text x="1152" y="574" class="module">Nitro Server API</text>
  <text x="1152" y="598" class="module-desc">会话鉴权 · 配置 / 群映射 · 数据读取 · Bot 测试转发</text>

  <path d="M1110 587H1060" class="solid" marker-end="url(#arrow)"/>
  <rect x="1020" y="548" width="72" height="40" rx="3" fill="#fff" stroke="#b8c4d3"/>
  <text x="1056" y="564" text-anchor="middle" class="tiny">HTTP</text>
  <text x="1056" y="580" text-anchor="middle" class="tiny">Token</text>
  <text x="1056" y="640" text-anchor="middle" class="tiny">Site → Bot Control</text>

  <!-- ========== QQ 连接层 ========== -->
  <path d="M650 678V712" class="dashed" marker-end="url(#arrow)"/>
  <path d="M1345 650V712" class="dashed" marker-end="url(#arrow)"/>

  <rect x="64" y="712" width="1592" height="168" rx="6" fill="#fff" stroke="#dfe6ef"/>
  <text x="88" y="744" class="layer">QQ 连接层</text>
  <text x="88" y="766" class="tiny">workspace 包 · 位于 Bot 运行时与 QQ 平台之间，不承载业务编排</text>

  <rect x="240" y="748" width="1336" height="108" rx="5" fill="#f8f5ff" stroke="#e0d6f5"/>
  <text x="260" y="776" class="module" fill="#5b4b8a">Bot 通过下列适配器与 QQ 通道通信</text>

  <rect x="260" y="792" width="300" height="48" rx="3" fill="#f4f1ff" stroke="#cfc3ea"/>
  <text x="278" y="812" class="module" fill="#6655a5">@nana/qq</text>
  <text x="278" y="830" class="module-desc">官方 Gateway / 消息编码 / 发送校验</text>

  <rect x="580" y="792" width="300" height="48" rx="3" fill="#f4f1ff" stroke="#cfc3ea"/>
  <text x="598" y="812" class="module" fill="#6655a5">@nana/napcat</text>
  <text x="598" y="830" class="module-desc">NapCat WebSocket / OneBot 适配</text>

  <text x="920" y="812" class="desc">仅被 apps/bot 依赖 · site 不直连 QQ</text>
  <text x="920" y="832" class="desc">官方与 NapCat 可同时运行，按账号 provider 选择</text>

  <!-- ========== 其他 packages ========== -->
  <path d="M650 880V912" class="dashed" marker-end="url(#arrow)"/>
  <path d="M1345 880V912" class="dashed" marker-end="url(#arrow)"/>

  <rect x="64" y="912" width="1592" height="200" rx="6" fill="#fff" stroke="#dfe6ef"/>
  <text x="88" y="944" class="layer">其他 workspace 包</text>
  <text x="88" y="966" class="tiny">业务能力与基础设施 · 按 package.json 直接依赖划分</text>

  <text x="240" y="964" class="module" fill="#475569">业务能力</text>
  <g>
    <rect x="240" y="978" width="200" height="52" rx="3" fill="#f1f6ff" stroke="#cbdaf3"/>
    <text x="254" y="998" class="module" fill="#315f9c">@nana/bilibili-api</text>
    <text x="254" y="1016" class="module-desc">B 站 API 封装</text>

    <rect x="456" y="978" width="200" height="52" rx="3" fill="#f4f1ff" stroke="#d9d1f2"/>
    <text x="470" y="998" class="module" fill="#6655a5">@nana/monitor</text>
    <text x="470" y="1016" class="module-desc">直播事件源抽象</text>

    <rect x="672" y="978" width="200" height="52" rx="3" fill="#fff7ed" stroke="#f0d7b9"/>
    <text x="686" y="998" class="module" fill="#a96527">@nana/live-summary</text>
    <text x="686" y="1016" class="module-desc">摘要摘录 / 提示词</text>

    <rect x="888" y="978" width="200" height="52" rx="3" fill="#f4f1ff" stroke="#d9d1f2"/>
    <text x="902" y="998" class="module" fill="#6655a5">@nana/wordcloud</text>
    <text x="902" y="1016" class="module-desc">分词 / 词云渲染</text>

    <rect x="1104" y="978" width="200" height="52" rx="3" fill="#fff7ed" stroke="#f0d7b9"/>
    <text x="1118" y="998" class="module" fill="#a96527">@nana/notify</text>
    <text x="1118" y="1016" class="module-desc">SMTP / Bark 通知</text>

    <rect x="1320" y="978" width="256" height="52" rx="3" fill="#fff7ed" stroke="#f0d7b9"/>
    <text x="1334" y="998" class="module" fill="#a96527">@nana/offline-detector</text>
    <text x="1334" y="1016" class="module-desc">离线状态检测</text>
  </g>

  <text x="240" y="1056" class="module" fill="#475569">基础设施</text>
  <g>
    <rect x="240" y="1070" width="180" height="28" rx="3" fill="#f8fafc" stroke="#dce3ec"/>
    <text x="254" y="1089" class="module">@nana/config</text>

    <rect x="436" y="1070" width="180" height="28" rx="3" fill="#f8fafc" stroke="#dce3ec"/>
    <text x="450" y="1089" class="module">@nana/constants</text>

    <rect x="632" y="1070" width="180" height="28" rx="3" fill="#eef8f3" stroke="#cce5d7"/>
    <text x="646" y="1089" class="module" fill="#347b59">@nana/storage</text>

    <rect x="828" y="1070" width="180" height="28" rx="3" fill="#f8fafc" stroke="#dce3ec"/>
    <text x="842" y="1089" class="module">@nana/utils</text>
  </g>

  <!-- ========== 共享数据 ========== -->
  <path d="M650 1112V1140" class="solid" marker-end="url(#arrow)"/>
  <path d="M1345 1112V1140" class="solid" marker-end="url(#arrow)"/>

  <rect x="64" y="1140" width="1592" height="100" rx="6" fill="#fff" stroke="#dfe6ef"/>
  <text x="88" y="1170" class="layer">共享配置与数据</text>
  <text x="88" y="1192" class="tiny">Bot / Site 访问同一项目根目录</text>

  <rect x="400" y="1158" width="340" height="64" rx="4" fill="#f8fafc" stroke="#dce3ec"/>
  <text x="420" y="1184" class="module">nana.config.yaml</text>
  <text x="420" y="1206" class="module-desc">账号 · 主播 · 群映射 · 消息规则</text>

  <rect x="760" y="1158" width="740" height="64" rx="4" fill="#f8fafc" stroke="#dce3ec"/>
  <text x="780" y="1184" class="module">db/*.sqlite</text>
  <text x="780" y="1206" class="module-desc">live-status · push-log · danmu · live-summary · qq-group · offline-alert · app-state</text>

  <text x="80" y="1264" class="tiny">实线：运行时请求 / 数据读写　·　虚线：应用对 workspace 包的依赖　·　@nana/qq 与 @nana/napcat 是 Bot 与 QQ 平台之间的连接层</text>
</svg>