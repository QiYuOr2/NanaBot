<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1680" viewBox="0 0 1100 1680" role="img" aria-labelledby="title desc">
  <title id="title">NanaBot 工程架构图</title>
  <desc id="desc">NanaBot 分层架构：外部服务、应用层、QQ 连接层、业务与基础设施包、共享数据。</desc>
  <defs>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b}
      .title{font-size:28px;font-weight:700;fill:#0f172a}
      .subtitle{font-size:14px;fill:#64748b}
      .section{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:0.5px}
      .card-title{font-size:16px;font-weight:700}
      .card-desc{font-size:13px;fill:#64748b}
      .chip-title{font-size:13px;font-weight:650}
      .chip-desc{font-size:11px;fill:#64748b}
      .hint{font-size:12px;fill:#94a3b8}
      .arrow{fill:none;stroke:#94a3b8;stroke-width:1.6}
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="1680" fill="#f8fafc"/>

  <!-- Header -->
  <text x="80" y="56" class="title">NanaBot 工程架构</text>
  <text x="80" y="82" class="subtitle">TypeScript · pnpm workspace · Vite+ · Bot / Site 独立部署</text>

  <!-- ========== 1. 外部服务 ========== -->
  <text x="80" y="130" class="section">外部服务</text>
  <rect x="80" y="146" width="940" height="88" rx="12" fill="#fff" stroke="#e2e8f0"/>

  <rect x="100" y="162" width="168" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="184" y="186" text-anchor="middle" class="chip-title" fill="#1d4ed8">Bilibili</text>
  <text x="184" y="204" text-anchor="middle" class="chip-desc">直播 API · 弹幕长连</text>

  <rect x="280" y="162" width="168" height="56" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="364" y="186" text-anchor="middle" class="chip-title" fill="#6d28d9">QQ 官方平台</text>
  <text x="364" y="204" text-anchor="middle" class="chip-desc">Gateway / Bot API</text>

  <rect x="460" y="162" width="168" height="56" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="544" y="186" text-anchor="middle" class="chip-title" fill="#6d28d9">NapCat</text>
  <text x="544" y="204" text-anchor="middle" class="chip-desc">WebSocket / OneBot</text>

  <rect x="640" y="162" width="168" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="724" y="186" text-anchor="middle" class="chip-title" fill="#c2410c">DeepSeek</text>
  <text x="724" y="204" text-anchor="middle" class="chip-desc">直播弹幕摘要</text>

  <rect x="820" y="162" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="910" y="186" text-anchor="middle" class="chip-title" fill="#047857">通知服务</text>
  <text x="910" y="204" text-anchor="middle" class="chip-desc">SMTP · Bark</text>

  <path d="M550 234V258" class="arrow" marker-end="url(#arr)"/>

  <!-- ========== 2. 应用层 ========== -->
  <text x="80" y="288" class="section">应用层 · 独立部署</text>

  <!-- apps/bot -->
  <rect x="80" y="304" width="560" height="280" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="104" y="336" class="card-title" fill="#1d4ed8">apps/bot</text>
  <text x="200" y="336" class="card-desc">多账号运行时与业务编排</text>

  <rect x="104" y="356" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="164" y="386" text-anchor="middle" class="chip-title">core</text>
  <text x="164" y="408" text-anchor="middle" class="chip-desc">生命周期</text>
  <text x="164" y="424" text-anchor="middle" class="chip-desc">连接监督</text>

  <rect x="236" y="356" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="296" y="386" text-anchor="middle" class="chip-title">accounts</text>
  <text x="296" y="408" text-anchor="middle" class="chip-desc">多账号路由</text>
  <text x="296" y="424" text-anchor="middle" class="chip-desc">通道选择</text>

  <rect x="368" y="356" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="428" y="386" text-anchor="middle" class="chip-title">message</text>
  <text x="428" y="408" text-anchor="middle" class="chip-desc">命令 / 规则</text>
  <text x="428" y="424" text-anchor="middle" class="chip-desc">消息归一化</text>

  <rect x="500" y="356" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="560" y="386" text-anchor="middle" class="chip-title">control</text>
  <text x="560" y="408" text-anchor="middle" class="chip-desc">内部 HTTP</text>
  <text x="560" y="424" text-anchor="middle" class="chip-desc">测试消息</text>

  <rect x="104" y="460" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="164" y="490" text-anchor="middle" class="chip-title">monitor</text>
  <text x="164" y="512" text-anchor="middle" class="chip-desc">开播 / 下播</text>
  <text x="164" y="528" text-anchor="middle" class="chip-desc">状态同步</text>

  <rect x="236" y="460" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="296" y="490" text-anchor="middle" class="chip-title">danmu</text>
  <text x="296" y="512" text-anchor="middle" class="chip-desc">录制 · 会话</text>
  <text x="296" y="528" text-anchor="middle" class="chip-desc">词云推送</text>

  <rect x="368" y="460" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="428" y="490" text-anchor="middle" class="chip-title">summary</text>
  <text x="428" y="512" text-anchor="middle" class="chip-desc">摘要生成</text>
  <text x="428" y="528" text-anchor="middle" class="chip-desc">补推</text>

  <rect x="500" y="460" width="120" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="560" y="490" text-anchor="middle" class="chip-title">offline</text>
  <text x="560" y="512" text-anchor="middle" class="chip-desc">离线检测</text>
  <text x="560" y="528" text-anchor="middle" class="chip-desc">邮件 / Bark</text>

  <!-- apps/site -->
  <rect x="668" y="304" width="352" height="280" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="692" y="336" class="card-title" fill="#047857">apps/site</text>
  <text x="790" y="336" class="card-desc">Nuxt 4 Dashboard</text>

  <rect x="692" y="356" width="304" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="844" y="386" text-anchor="middle" class="chip-title">Web UI</text>
  <text x="844" y="408" text-anchor="middle" class="chip-desc">概览 · 推送 · 弹幕 · 告警</text>
  <text x="844" y="424" text-anchor="middle" class="chip-desc">日志 · 系统 · 设置</text>

  <rect x="692" y="460" width="304" height="88" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="844" y="490" text-anchor="middle" class="chip-title">Nitro Server API</text>
  <text x="844" y="512" text-anchor="middle" class="chip-desc">鉴权 · 群映射 · 数据读取</text>
  <text x="844" y="528" text-anchor="middle" class="chip-desc">Bot 测试消息转发</text>

  <!-- Site → Bot note -->
  <text x="844" y="572" text-anchor="middle" class="hint">Site 经 HTTP + Token 调用 Bot Control</text>

  <path d="M550 584V608" class="arrow" marker-end="url(#arr)"/>

  <!-- ========== 3. QQ 连接层 ========== -->
  <text x="80" y="638" class="section">QQ 连接层 · Bot ↔ QQ 平台</text>
  <rect x="80" y="654" width="940" height="120" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>

  <text x="550" y="684" text-anchor="middle" class="card-desc">仅被 apps/bot 依赖 · site 不直连 QQ · 按账号 provider 选择通道</text>

  <rect x="200" y="704" width="300" height="48" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="350" y="724" text-anchor="middle" class="chip-title" fill="#6d28d9">@nana/qq</text>
  <text x="350" y="742" text-anchor="middle" class="chip-desc">官方 Gateway · 消息编码 · 发送校验</text>

  <rect x="540" y="704" width="300" height="48" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="690" y="724" text-anchor="middle" class="chip-title" fill="#6d28d9">@nana/napcat</text>
  <text x="690" y="742" text-anchor="middle" class="chip-desc">NapCat WebSocket · OneBot 适配</text>

  <path d="M550 774V798" class="arrow" marker-end="url(#arr)"/>

  <!-- ========== 4. 业务能力包 ========== -->
  <text x="80" y="828" class="section">业务能力包</text>
  <rect x="80" y="844" width="940" height="100" rx="12" fill="#fff" stroke="#e2e8f0"/>

  <rect x="100" y="864" width="140" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="170" y="890" text-anchor="middle" class="chip-title" fill="#1d4ed8">@nana/bilibili-api</text>
  <text x="170" y="908" text-anchor="middle" class="chip-desc">B 站 API</text>

  <rect x="252" y="864" width="140" height="60" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="322" y="890" text-anchor="middle" class="chip-title" fill="#6d28d9">@nana/monitor</text>
  <text x="322" y="908" text-anchor="middle" class="chip-desc">直播事件源</text>

  <rect x="404" y="864" width="150" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="479" y="890" text-anchor="middle" class="chip-title" fill="#c2410c">@nana/live-summary</text>
  <text x="479" y="908" text-anchor="middle" class="chip-desc">摘要摘录</text>

  <rect x="566" y="864" width="140" height="60" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="636" y="890" text-anchor="middle" class="chip-title" fill="#6d28d9">@nana/wordcloud</text>
  <text x="636" y="908" text-anchor="middle" class="chip-desc">分词 · 词云</text>

  <rect x="718" y="864" width="130" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="783" y="890" text-anchor="middle" class="chip-title" fill="#c2410c">@nana/notify</text>
  <text x="783" y="908" text-anchor="middle" class="chip-desc">SMTP · Bark</text>

  <rect x="860" y="864" width="140" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="930" y="888" text-anchor="middle" class="chip-title" fill="#c2410c">offline-detector</text>
  <text x="930" y="908" text-anchor="middle" class="chip-desc">离线检测</text>

  <path d="M550 944V968" class="arrow" marker-end="url(#arr)"/>

  <!-- ========== 5. 基础设施包 ========== -->
  <text x="80" y="998" class="section">基础设施包</text>
  <rect x="80" y="1014" width="940" height="80" rx="12" fill="#fff" stroke="#e2e8f0"/>

  <rect x="160" y="1032" width="160" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="240" y="1060" text-anchor="middle" class="chip-title">@nana/config</text>

  <rect x="340" y="1032" width="160" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="420" y="1060" text-anchor="middle" class="chip-title">@nana/constants</text>

  <rect x="520" y="1032" width="160" height="44" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="600" y="1060" text-anchor="middle" class="chip-title" fill="#047857">@nana/storage</text>

  <rect x="700" y="1032" width="160" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="780" y="1060" text-anchor="middle" class="chip-title">@nana/utils</text>

  <path d="M550 1094V1118" class="arrow" marker-end="url(#arr)"/>

  <!-- ========== 6. 共享数据 ========== -->
  <text x="80" y="1148" class="section">共享配置与数据 · 同一项目根目录</text>
  <rect x="80" y="1164" width="940" height="100" rx="12" fill="#fff" stroke="#e2e8f0"/>

  <rect x="120" y="1184" width="400" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="320" y="1210" text-anchor="middle" class="chip-title">nana.config.yaml</text>
  <text x="320" y="1228" text-anchor="middle" class="chip-desc">账号 · 主播 · 群映射 · 消息规则</text>

  <rect x="540" y="1184" width="440" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="760" y="1210" text-anchor="middle" class="chip-title">db/*.sqlite</text>
  <text x="760" y="1228" text-anchor="middle" class="chip-desc">live-status · push-log · danmu · qq-group · …</text>

  <!-- Footer note -->
  <text x="550" y="1310" text-anchor="middle" class="hint">@nana/qq / @nana/napcat 是 Bot 与 QQ 平台之间的连接层，不承载业务编排</text>
  <text x="550" y="1332" text-anchor="middle" class="hint">实线箭头：运行时数据流　·　各层由上到下依赖</text>

  <!-- Message pipeline inset -->
  <text x="80" y="1390" class="section">消息处理链路（bot message 模块）</text>
  <rect x="80" y="1406" width="940" height="240" rx="12" fill="#fff" stroke="#e2e8f0"/>

  <rect x="280" y="1424" width="540" height="28" rx="6" fill="#eff6ff"/>
  <text x="550" y="1443" text-anchor="middle" class="chip-title" fill="#1d4ed8">QQ 消息接收 · NapCat / 官方机器人事件</text>

  <path d="M550 1452V1464" class="arrow" marker-end="url(#arr)"/>

  <rect x="280" y="1464" width="540" height="28" rx="6" fill="#f5f3ff"/>
  <text x="550" y="1483" text-anchor="middle" class="chip-title" fill="#6d28d9">Message Adapter · 统一平台消息格式</text>

  <path d="M550 1492V1504" class="arrow" marker-end="url(#arr)"/>

  <rect x="280" y="1504" width="540" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="1523" text-anchor="middle" class="chip-title">Message Dispatcher · 过滤 · 权限 · 去重 · 上下文</text>

  <path d="M550 1532V1544" class="arrow" marker-end="url(#arr)"/>

  <rect x="280" y="1544" width="256" height="28" rx="6" fill="#eff6ff"/>
  <text x="408" y="1563" text-anchor="middle" class="chip-title" fill="#1d4ed8">Command Handler</text>

  <rect x="564" y="1544" width="256" height="28" rx="6" fill="#ecfdf5"/>
  <text x="692" y="1563" text-anchor="middle" class="chip-title" fill="#047857">Rule Engine</text>

  <path d="M550 1572V1584" class="arrow" marker-end="url(#arr)"/>

  <rect x="280" y="1584" width="540" height="28" rx="6" fill="#fff7ed"/>
  <text x="550" y="1603" text-anchor="middle" class="chip-title" fill="#c2410c">Response Context · 生成回复 · 确定目标</text>

  <path d="M550 1612V1624" class="arrow" marker-end="url(#arr)"/>

  <rect x="280" y="1624" width="540" height="28" rx="6" fill="#ecfdf5"/>
  <text x="550" y="1643" text-anchor="middle" class="chip-title" fill="#047857">统一消息发送 · 复用 QQ / Notify 发送能力</text>
</svg>