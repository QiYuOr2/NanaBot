packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true

catalog:
  "@fontsource/geist-mono": ^5.3.0
  "@fontsource/geist-sans": ^5.3.0
  "@types/node": ^24.13.3
  js-yaml: ^5.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  zod: ^4.4.3

catalogMode: prefer

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
