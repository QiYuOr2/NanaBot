packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true

catalog:
  "@fontsource/geist-mono": ^5.3.0
  "@fontsource/geist-sans": ^5.3.0
  "@node-rs/jieba": ^2.0.4
  "@resvg/resvg-js": ^2.6.2
  "@tencent-connect/qqbot-connector": ^1.2.0
  "@tencent-connect/qqbot-nodejs": ^1.0.5
  "@types/node": ^24.13.3
  js-yaml: ^5.3.0
  nodemailer: ^10.0.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  yaml: ^2.9.0
  zod: ^4.4.3

catalogMode: prefer

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0

overrides:
  tiny-bilibili-ws: "1.0.2"
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
