  "@fontsource/geist-sans": ^5.3.0
  "@node-rs/jieba": ^2.0.4
  "@resvg/resvg-js": ^2.6.2
  "@tencent-connect/qqbot-connector": ^1.2.0
  "@tencent-connect/qqbot-nodejs": ^1.0.5
  "@types/node": ^24.13.3
  js-yaml: ^5.3.0
  nodemailer: ^10.0.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  yaml: ^2.9.0
  zod: ^4.4.3

catalogMode: prefer

overrides:
