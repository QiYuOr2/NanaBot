name: Build bot

on:
  push:
    branches: [v2]
    paths:
      - "apps/bot/**"
      - "packages/bilibili-api/**"
      - "packages/config/**"
      - "packages/constants/**"
      - "packages/live-summary/**"
      - "packages/monitor/**"
      - "packages/napcat/**"
      - "packages/notify/**"
      - "packages/offline-detector/**"
      - "packages/qq/**"
      - "packages/storage/**"
      - "packages/utils/**"
      - "packages/wordcloud/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/bot.yml"
      - "scripts/deploy-bot-output.sh"
      - "scripts/tests/deploy-bot-output.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-build-${{ github.ref }}
  # 部署中途的取消会让 bot 停在重启窗口内，因此不取消进行中的运行。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bot dependencies
        run: pnpm --filter "@nana/bot^..." --workspace-concurrency=1 run build

      - name: Test bot
        run: pnpm --filter "@nana/bot" run test

      - name: Test offline detector
        run: pnpm --filter "@nana/offline-detector" run test

      - name: Test bot deployment script
        run: pnpm exec vp test scripts/tests/deploy-bot-output.test.ts

      - name: Build bot
        run: pnpm build:bot

      - name: Stage production artifact
        run: |
          set -euo pipefail
          rm -rf bot-stage bot-deploy-scratch
          mkdir -p bot-stage
          # bot 的 bundle 把部分包留作 external，运行时需要真实的 node_modules。
          # 必须用注入式 deploy：--legacy 不会带上 workspace 包自身的依赖
          #（如 @nana/config 的 yaml、@nana/qq 的 @tencent-connect/qqbot-nodejs），
          # 2026-11-14 首次部署就因缺 yaml 在启动时崩溃并回滚。
          pnpm --config.inject-workspace-packages=true --filter "@nana/bot" deploy --prod bot-deploy-scratch
          cp -R bot-deploy-scratch/node_modules bot-stage/node_modules
          cp -R apps/bot/dist bot-stage/dist
          rm -rf bot-deploy-scratch
          # bundle 顶层还会直接 import 个别并非 bot 直接依赖的包（同上例），
          # 它们只存在于 .pnpm 虚拟存储里；为其在顶层补符号链接，保证从 dist 出发可解析。
          cat > bot-link-externals.mjs <<'SCRIPT'
          import { existsSync, lstatSync, mkdirSync, readdirSync, readFileSync, symlinkSync } from "node:fs";
          import { dirname, join, relative } from "node:path";
          const stageDir = process.argv[2];
          const nmDir = join(stageDir, "node_modules");
          const bundle = readFileSync(join(stageDir, "dist", "index.mjs"), "utf8");
          import { builtinModules } from "node:module";
          const builtins = new Set(builtinModules.flatMap((name) => [name, name.replace(/^node:/, "")]));
          const specs = new Set();
          for (const match of bundle.matchAll(/(?:from\s*|import\s*|import\s*\(|require\s*\()\s*["']([A-Za-z0-9@/._#-]+)["']/g)) {
            const spec = match[1];
            if (spec.startsWith(".") || spec.startsWith("/") || spec.startsWith("node:") || builtins.has(spec)) continue;
            specs.add(spec);
          }
          const packageOf = (spec) => (spec.startsWith("@") ? spec.split("/").slice(0, 2).join("/") : spec.split("/")[0]);
          const packages = [...new Set([...specs].map(packageOf))];
          const findInStore = (pkg) => {
            const storeDir = join(nmDir, ".pnpm");
            if (!existsSync(storeDir)) return undefined;
            for (const entry of readdirSync(storeDir)) {
              const candidate = join(storeDir, entry, "node_modules", pkg);
              if (existsSync(join(candidate, "package.json"))) return candidate;
            }
            return undefined;
          };
          let failed = false;
          for (const pkg of packages) {
            const dest = join(nmDir, pkg);
            try { lstatSync(dest); continue; } catch { /* 顶层缺失，下面补链接 */ }
            const target = findInStore(pkg);
            if (!target) { console.error(`external ${pkg} is missing from the staged node_modules`); failed = true; continue; }
            mkdirSync(dirname(dest), { recursive: true });
            symlinkSync(relative(dirname(dest), target), dest);
            console.log(`linked external ${pkg} -> ${target}`);
          }
          if (failed) process.exit(1);
          SCRIPT
          node bot-link-externals.mjs bot-stage
          rm bot-link-externals.mjs

      - name: Verify Linux artifact
        run: |
          set -euo pipefail
          test -f bot-stage/dist/index.mjs
          test -d bot-stage/node_modules
          find bot-stage/node_modules -type f -name '*.node' -print
          # pnpm 的虚拟存储把平台专用包放在 .pnpm 目录下，不能按顶层路径断言，改为全树查找。
          test -n "$(find bot-stage/node_modules -type d -name 'jieba-linux-x64-gnu' -print -quit)"
          test -n "$(find bot-stage/node_modules -type d -name 'resvg-js-linux-x64-gnu' -print -quit)"
          # 从 bundle 自身的位置出发，逐个 import 全部 external 做冒烟测试；
          # 任一缺失都会在这里失败，而不是等部署到服务器启动时才崩溃。
          cat > bot-stage/dist/__verify_externals.mjs <<'SCRIPT'
          import { readFileSync } from "node:fs";
          const bundle = readFileSync(new URL("./index.mjs", import.meta.url), "utf8");
          import { builtinModules } from "node:module";
          const builtins = new Set(builtinModules.flatMap((name) => [name, name.replace(/^node:/, "")]));
          const specs = new Set();
          for (const match of bundle.matchAll(/(?:from\s*|import\s*|import\s*\(|require\s*\()\s*["']([A-Za-z0-9@/._#-]+)["']/g)) {
            const spec = match[1];
            if (spec.startsWith(".") || spec.startsWith("/") || spec.startsWith("node:") || builtins.has(spec)) continue;
            specs.add(spec);
          }
          let failed = 0;
          for (const spec of specs) {
            try { await import(spec); console.log(`import ok: ${spec}`); }
            catch (error) { failed += 1; console.error(`import failed: ${spec} (${error.code ?? error.message})`); }
          }
          if (failed > 0) process.exit(1);
          console.log(`all ${specs.size} bundle externals import ok`);
          SCRIPT
          node bot-stage/dist/__verify_externals.mjs
          rm bot-stage/dist/__verify_externals.mjs

      - name: Package bot artifact
        run: tar -C bot-stage -czf bot-output.tar.gz .

      - name: Upload bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-output-${{ github.sha }}
          path: bot-output.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Check deploy configuration
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_* secrets are not configured; the artifact was built but not deployed."
          fi

      - name: Configure SSH
        if: steps.deploy.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy bot artifact
        if: steps.deploy.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote_arch="$(ssh -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" 'uname -m')"
          if [ "$remote_arch" != "x86_64" ]; then
            echo "::error::The bot artifact targets Linux x64, but the server reports $remote_arch."
            exit 1
          fi
          scp -P "$port" bot-output.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/bot-output.tar.gz.next"
          ssh -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && BOT_DEPLOY_REF='${{ github.sha }}' bash -s -- bot-output.tar.gz.next" \
            < scripts/deploy-bot-output.sh
